[project]
name = "android-mcp-gateway"
version = "0.1.0"
description = "Android MCP Gateway：聚合安卓设备工具为 MCP (Streamable HTTP)，设备经 WSS 出站长连接注册"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12",
    "starlette>=0.41",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
